<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CoCo AI 面试官</title><style>body{margin:0;background:#f5f7ff;color:#17213d;font-family:Arial,"Microsoft Yahei",sans-serif}.app{max-width:1100px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between}.brand{font-size:25px;font-weight:800}.brand span{color:#3157d8}.pill,.tag{padding:9px 14px;border-radius:20px;background:#e9edff;color:#3157d8}.layout{display:grid;grid-template-columns:1.5fr .8fr;gap:24px;margin-top:30px}.card{background:white;border-radius:24px;padding:34px;box-shadow:0 14px 40px #3157d81a}.hero{min-height:570px}.eyebrow{color:#3157d8;font-weight:bold}.hero h1{font-size:42px;line-height:1.2}.hero h1 em{color:#3157d8;font-style:normal}.sub,p{color:#7180a6;line-height:1.7}.robot{width:105px;height:105px;border-radius:32px;background:#3157d8;color:white;display:grid;place-items:center;font-size:40px}.question{font-size:22px;font-weight:bold;line-height:1.5;margin-top:22px}.textarea{width:100%;min-height:100px;margin-top:18px;padding:15px;border:1px solid #dfe5f6;border-radius:14px;resize:vertical;font:inherit;color:#17213d}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:bold;cursor:pointer}.primary{background:#3157d8;color:#fff}.ghost{background:#eef1ff;color:#3157d8}.meter{height:9px;background:#edf0f8;border-radius:10px}.meter i{display:block;width:0;height:100%;background:#3157d8;border-radius:10px;transition:.3s}.tag{display:inline-block;margin:6px 4px 0 0;font-size:13px}.feed{margin-top:28px}.feed article{padding:14px 0;border-bottom:1px solid #edf0f5}.feed b{line-height:1.5;display:block}.toast{display:none;position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#17213d;color:white;padding:12px 18px;border-radius:10px}a{color:#3157d8}input.textarea{display:block;min-height:20px;margin-top:10px}#register{margin-top:15px}</style><main class="app"><header class="top"><div class="brand">Co<span>Co</span> <small>AI 面试官</small></div><div class="pill">灵魂匹配 · 社区连接</div></header><section class="layout"><div class="card hero"><div class="eyebrow" id="step">注册 CoCo · 开始你的兴趣探索</div><h1>不急着给你贴标签，<br><em>先听你怎么想。</em></h1><p class="sub">CoCo 不预设答案。它会根据你的每一次回答动态追问，也允许你随时回到上一题或跳过当前维度。</p><div class="robot">◉‿◉</div><div class="question" id="q">先告诉 CoCo，你希望被怎样称呼？</div><div id="register"><input class="textarea" id="name" placeholder="你的昵称"><input class="textarea" id="age" placeholder="年龄"><input class="textarea" id="interest" placeholder="基础兴趣，例如：音乐、电影、旅行"></div><textarea class="textarea" id="input" placeholder="输入你的回答，CoCo 会认真读完再继续…"></textarea><div class="actions"><button class="btn primary" id="start">开始回答</button><button class="btn ghost" id="back">上一题</button><button class="btn ghost" id="skip">跳过</button></div></div><aside class="card"><h3>你的兴趣画像</h3><div class="meter"><i id="bar"></i></div><p id="count">已完成 0 / 5 个探索维度</p><div id="tags"><span class="tag">待探索</span></div><div class="feed"><h3>知乎真实内容</h3><div id="results"><p>完成回答后，CoCo 会根据你的表达检索知乎。</p></div></div></aside></section></main><div class="toast" id="toast"></div><script>let index=-1,history=[],finished=false,profile=[],used=[];const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1600)}function fallback(text){const n=history.length,interest=$('interest').value.trim();const pool=[`关于${interest}，什么样的内容会让你愿意停下来认真阅读？`,`在${interest}相关的话题里，你更想寻找同好、不同观点，还是可执行的方法？`,`如果把${interest}带进现实社交，你最希望和别人一起做什么？`,`你在${interest}上的判断，通常来自亲身经历、长期观察，还是某个让你印象深刻的人？`];return pool[n%pool.length]}function render(){if(finished){$('q').textContent='探索完成';$('step').textContent='完成 · 你的 CoCo 画像已生成';$('input').style.display='none';['start','skip','back'].forEach(x=>$(x).style.display='none');$('register').style.display='none';$('count').textContent='已完成 5 / 5 个探索维度';$('bar').style.width='100%';$('tags').innerHTML=profile.slice(-5).map(x=>`<span class="tag">${x}</span>`).join('')||'<span class="tag">真实表达</span>';return}$('q').textContent=index<0?'注册资料会帮助 CoCo 设计第一道问题':history[index].question;$('step').textContent=index<0?'注册 CoCo · 开始你的兴趣探索':`${index+1} / 5 · 根据你的资料与回答生成`;$('count').textContent=`已完成 ${history.length} / 5 个探索维度`;$('bar').style.width=(history.length*20)+'%';$('start').textContent=index<0?'启动 CoCo':'提交并继续';$('register').style.display=index<0?'block':'none';$('input').style.display=index<0?'none':'block'}async function search(text){try{const r=await fetch('/api/search?q='+encodeURIComponent(text));const j=await r.json();$('results').innerHTML=(j.items||[]).slice(0,5).map(x=>`<article><b><a target="_blank" href="${x.url}">${x.title}</a></b><p>综合评分 ${x.score||0} · ${x.votes} 赞 · ${x.comments} 评论<br>${x.summary}</p></article>`).join('')||'<p>没有找到相关内容。</p>'}catch(e){$('results').innerHTML='<p>知乎接口暂时不可用，请确认 server.js 正在运行。</p>'}}async function askModel(){const r=await fetch('/api/next',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile:{name:$('name').value,age:$('age').value,interest:$('interest').value},history,used_questions:used})});const j=await r.json();return j.ok&&j.result?j.result:null}$('start').onclick=async()=>{if(index<0){if(!$('name').value.trim()||!$('age').value.trim()||!$('interest').value.trim())return toast('请先完成注册信息');const p=`，岁，兴趣是`;const m=await askModel().catch(()=>null);history.push({question:m&&m.question?m.question:`对你来说最特别的地方是什么？`});used.push(history[0].question);index=0;render();toast('CoCo 已根据你的资料生成第一题');return}const text=$('input').value.trim();if(!text)return toast('请先输入回答');history[index].answer=text;profile.push(text);$('input').value='';const all=[interest.value].concat(history.map(x=>x.answer||''));search(all.join(' '));if(history.length>=5){finished=true;render();toast('探索完成，正在生成综合推荐');return}const m=await askModel().catch(()=>null);let q=m&&m.question?m.question:fallback(text);if(used.includes(q))q=fallback(text)+'（换一个角度谈谈）';if(m&&m.tags)profile.push(...m.tags);used.push(q);history.push({question:q});index=history.length-1;$('input').value='';render();toast(m?'CoCo 已理解上下文并生成新问题':'已使用不重复的本地追问')};$('back').onclick=()=>{if(index<=0)return toast('已经是第一题');history.pop();used.pop();index=history.length-1;render();$('input').value='';toast('已回退')};$('skip').onclick=()=>{if(index<0||index>=4)return toast('最后一题请完成回答');history[index].answer='未知';history[index].skipped=true;profile.push('待探索');const q=fallback('未知');used.push(q);history.push({question:q});index=history.length-1;$('input').value='';render();toast('已跳过当前维度')};render();</script></html>
